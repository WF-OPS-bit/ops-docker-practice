# upstream 定义在 http 上下文中（本文件被 include 进 nginx.conf 的 http 块）
upstream backend {
    # 加权轮询：web1 权重 2，web2 权重 1，模拟两台机器配置不同
    server web1:8080 weight=2 max_fails=3 fail_timeout=30s;
    server web2:8080 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Nginx 自己的代理缓存区。注意：必须是 GET / HEAD 才会进缓存。
proxy_cache_path /var/cache/nginx/app levels=1:2 keys_zone=app_cache:10m
                 max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;

    # ---- 静态资源：不经过后端，直接由 Nginx 返回 + 浏览器缓存 ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 动态请求：反代到后端，默认不开启代理缓存 ----
    # location 越长越优先，所以 /api/cache-time 会被下面那个块抢走
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ---- 开启代理缓存的接口（单独一个 location，专用于验证 proxy_cache） ----
    #
    # 为什么 /api/hi 不开缓存：
    #   一旦命中缓存，Nginx 直接返回缓存副本、不再回源，
    #   连续请求会永远命中同一台实例 —— 负载均衡的验证会被缓存"吃掉"。
    #   所以负载均衡用 /api/hi 验证，缓存用 /api/cache-time 验证，两者分开。
    location /api/cache-time {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_cache app_cache;
        proxy_cache_valid 200 302 5m;
        proxy_cache_key $scheme$request_method$host$request_uri;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
