services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      web1: { condition: service_healthy }
      web2: { condition: service_healthy }
    networks: [app_net]
    restart: unless-stopped

  # YAML 锚点：web1 的完整定义复用给 web2，两个实例配置完全一致
  web1: &web
    build:
      context: ./app
      # 构建时用宿主机网络：容器内的 resolv.conf 是 dockerd 生成的，宿主机 resolv.conf
      # 只有 127.0.0.1 时 Docker 会回退到 8.8.8.8，国内解析不了 → maven 下载全部失败。
      # 走 host 网络后构建阶段直接复用宿主机的 DNS，不依赖 daemon.json 配置。
      network: host
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [app_net]
    restart: unless-stopped

  web2:
    <<: *web

  mysql:
    image: mysql:8.0
    # MySQL 8 默认用 caching_sha2_password，老客户端连不上；这里显式改回 mysql_native_password
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app_net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      # ${REDIS_PASSWORD} 是 compose 在解析时从 .env 替换的，不是容器里的 shell 变量，
      # 因为 redis 容器本身没有注入 REDIS_PASSWORD 这个环境变量
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_net]
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  nginx_cache:

networks:
  app_net:
    driver: bridge
