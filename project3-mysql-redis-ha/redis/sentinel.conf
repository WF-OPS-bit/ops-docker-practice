# Redis Sentinel 模板配置
#
# 这个文件是"模板"，不是哨兵实际运行时读的那份。
#
# 关键原因：Redis Sentinel 启动后会把自身状态（已知从库、纪元、主库地址等）
# 回写到自己的配置文件。如果直接把仓库里的文件挂进去跑，会出现两个问题：
#   1) 文件被写脏，下次 git status 全是改动；
#   2) 三个哨兵共用一个文件会互相覆盖，状态错乱。
#
# 所以 compose 里的做法是：启动时把这个只读模板 cp 到容器可写层 /tmp，
# 再追加 auth-pass 后启动 —— 每个哨兵各有一份独立副本，模板始终干净。
#
# sentinel auth-pass 由 compose 的 command 追加到文件末尾（必须在 monitor 之后）

bind 0.0.0.0
port 26379

# mymaster = 监控的主节点别名，2 = 判定客观下线所需的哨兵票数
# 一共 3 个哨兵，quorum 取 2 可避免单点哨兵误判
#
# 这里写的是 IP 而不是容器名 redis-master：
# Redis 7.4 的 Sentinel 在加载配置文件阶段就会解析 master 主机名，而 alpine 用的
# musl libc 在这个场景下解析失败，会直接报
#   Can't resolve instance hostname / Failed to resolve hostname 'redis-master'
#   *** FATAL CONFIG FILE ERROR ***
# 然后退出（表现为容器一直 Restarting）。
# 该地址由 docker-compose.yml 的 ipam 固定分配，见 README 踩坑 7.8。
sentinel monitor mymaster 172.28.0.10 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 60000
